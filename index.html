<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <title>高三（47）班学费缴款书查询</title>
  <style>
    :root {
      --primary: #1a6fb5;
      --primary-dark: #145a94;
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #222;
      --muted: #666;
      --border: #e5e8ef;
      --danger: #c0392b;
      --ok: #1e8449;
      --radius: 12px;
      --shadow: 0 2px 12px rgba(0,0,0,.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
        "Microsoft YaHei", "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 40px;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    header {
      text-align: center;
      padding: 8px 0 16px;
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
    }
    header .sub {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px 18px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }
    .notice {
      font-size: 0.92rem;
      color: #333;
      white-space: pre-wrap;
    }
    .notice strong { color: var(--primary); }
    #page-qr {
      text-align: center;
      padding: 18px 12px;
      border: 2px dashed #c5d0de;
      border-radius: var(--radius);
      background: #fafbfd;
      color: var(--muted);
      font-size: 0.88rem;
    }
    #page-qr img {
      max-width: 180px;
      width: 100%;
      height: auto;
      display: block;
      margin: 8px auto 0;
    }
    label {
      display: block;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 8px;
      margin-top: 12px;
    }
    label:first-of-type { margin-top: 0; }
    .helper {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 400;
      margin-top: 4px;
    }
    input[type="text"] {
      width: 100%;
      font-size: 1.05rem;
      padding: 12px 14px;
      border: 1px solid #ccd3df;
      border-radius: 10px;
      outline: none;
      background: #fff;
      -webkit-appearance: none;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(26,111,181,.15);
    }
    .form-helper {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 10px;
    }
    .btn {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 13px 16px;
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { background: var(--primary-dark); }
    .btn:disabled { opacity: 0.65; cursor: wait; }
    .btn-secondary {
      background: #fff;
      color: var(--primary);
      border: 1.5px solid var(--primary);
      margin-top: 8px;
    }
    .btn-secondary:active { background: #eef5fb; }
    .msg {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.92rem;
      display: none;
    }
    .msg.error { display: block; background: #fdecea; color: var(--danger); }
    .msg.info { display: block; background: #eef6fc; color: var(--primary-dark); }
    .result { display: none; }
    .result.show { display: block; }
    .result-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .result-meta {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .preview-wrap {
      text-align: center;
      background: #f0f2f5;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .preview-wrap img {
      width: 100%;
      height: auto;
      display: block;
      vertical-align: top;
    }
    .actions { margin-top: 12px; }
    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #999;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>高三（47）班学费缴款书</h1>
      <div class="sub">家长自助查询 · 查看 / 下载</div>
    </header>

    <div class="card">
      <div class="notice" id="notice">各位家长好，本学期学费缴款书已可自助领取：
① 扫描下方二维码，输入学生姓名 + 身份证，即可查看孩子的缴款书；
② 用微信/支付宝扫描缴款书右上角二维码完成缴费；
③ 缴费后截图保存回执，并通过家长微信群中的文件夹提交【缴费回执发票】（每生一份）。</div>
    </div>

    <div class="card" id="page-qr">
      <div>本页二维码</div>
      <div style="margin-top:6px;">上传到网上后此处可放本页二维码</div>
      <div class="helper" style="margin-top:8px;">教师可用 scripts/generate_page_qr.py 生成 page-qr.png 后放到本目录</div>
    </div>

    <div class="card">
      <form id="query-form" autocomplete="off" onsubmit="return false;">
        <label for="name-input">学生姓名</label>
        <input type="text" id="name-input" name="name" placeholder="例如：张三" enterkeyhint="next" maxlength="20" autocomplete="off" />
        <label for="id-input">身份证号</label>
        <input type="text" id="id-input" name="id" placeholder="请输入18位身份证号" enterkeyhint="search" maxlength="18" autocomplete="off" />
        <div class="form-helper">姓名与身份证须与学校登记一致</div>
        <button type="submit" class="btn" id="query-btn">查询</button>
        <div class="msg" id="msg"></div>
      </form>
    </div>

    <div class="card result" id="result-card">
      <div class="result-title" id="result-name"></div>
      <div class="result-meta" id="result-meta"></div>
      <div class="preview-wrap">
        <img id="preview-img" alt="缴款书预览" />
      </div>
      <div class="actions">
        <a class="btn" id="download-pdf" href="#" download>下载 PDF 缴款书</a>
        <a class="btn btn-secondary" id="open-preview" href="#" target="_blank" rel="noopener">查看大图（JPG）</a>
      </div>
    </div>

    <footer>仅供本班家长查询使用 · 请妥善保管缴款信息</footer>
  </div>

  <script src="data.js"></script>
  <script>
    /* Minimal sync SHA-256 (works on file:// when crypto.subtle is unavailable) */
    function sha256sync(str) {
      function rotr(n, x) { return (x >>> n) | (x << (32 - n)); }
      function toBytes(s) {
        var utf8 = unescape(encodeURIComponent(s));
        var arr = new Array(utf8.length);
        for (var i = 0; i < utf8.length; i++) arr[i] = utf8.charCodeAt(i);
        return arr;
      }
      var K = [
        0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
        0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
        0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
        0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
        0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
        0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
        0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
        0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
      ];
      var H = [
        0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19
      ];
      var bytes = toBytes(str);
      var l = bytes.length;
      var bitLen = l * 8;
      bytes.push(0x80);
      while ((bytes.length % 64) !== 56) bytes.push(0);
      for (var i = 7; i >= 0; i--) bytes.push((Math.floor(bitLen / Math.pow(2, i * 8))) & 0xff);
      // fix high bits properly for lengths < 2^53
      bytes[bytes.length - 8] = 0;
      bytes[bytes.length - 7] = 0;
      bytes[bytes.length - 6] = 0;
      bytes[bytes.length - 5] = 0;
      bytes[bytes.length - 4] = (bitLen >>> 24) & 0xff;
      bytes[bytes.length - 3] = (bitLen >>> 16) & 0xff;
      bytes[bytes.length - 2] = (bitLen >>> 8) & 0xff;
      bytes[bytes.length - 1] = bitLen & 0xff;

      for (var chunk = 0; chunk < bytes.length; chunk += 64) {
        var w = new Array(64);
        for (var i = 0; i < 16; i++) {
          var j = chunk + i * 4;
          w[i] = ((bytes[j] << 24) | (bytes[j + 1] << 16) | (bytes[j + 2] << 8) | bytes[j + 3]) >>> 0;
        }
        for (var i = 16; i < 64; i++) {
          var s0 = (rotr(7, w[i - 15]) ^ rotr(18, w[i - 15]) ^ (w[i - 15] >>> 3)) >>> 0;
          var s1 = (rotr(17, w[i - 2]) ^ rotr(19, w[i - 2]) ^ (w[i - 2] >>> 10)) >>> 0;
          w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
        }
        var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
        for (var i = 0; i < 64; i++) {
          var S1 = (rotr(6, e) ^ rotr(11, e) ^ rotr(25, e)) >>> 0;
          var ch = ((e & f) ^ (~e & g)) >>> 0;
          var t1 = (h + S1 + ch + K[i] + w[i]) >>> 0;
          var S0 = (rotr(2, a) ^ rotr(13, a) ^ rotr(22, a)) >>> 0;
          var maj = ((a & b) ^ (a & c) ^ (b & c)) >>> 0;
          var t2 = (S0 + maj) >>> 0;
          h = g; g = f; f = e; e = (d + t1) >>> 0;
          d = c; c = b; b = a; a = (t1 + t2) >>> 0;
        }
        H[0] = (H[0] + a) >>> 0;
        H[1] = (H[1] + b) >>> 0;
        H[2] = (H[2] + c) >>> 0;
        H[3] = (H[3] + d) >>> 0;
        H[4] = (H[4] + e) >>> 0;
        H[5] = (H[5] + f) >>> 0;
        H[6] = (H[6] + g) >>> 0;
        H[7] = (H[7] + h) >>> 0;
      }
      var hex = "";
      for (var i = 0; i < 8; i++) {
        var t = H[i].toString(16);
        hex += ("00000000" + t).slice(-8);
      }
      return hex;
    }

    (function () {
      var data = window.PAYMENT_DATA || [];
      var form = document.getElementById("query-form");
      var nameInput = document.getElementById("name-input");
      var idInput = document.getElementById("id-input");
      var msg = document.getElementById("msg");
      var resultCard = document.getElementById("result-card");
      var queryBtn = document.getElementById("query-btn");
      var pageQr = document.getElementById("page-qr");
      var FAIL = "姓名或身份证号不正确，请核对后重试";

      (function tryLoadPageQr() {
        var img = new Image();
        img.onload = function () {
          pageQr.innerHTML = "<div>扫描下方二维码打开本页</div>";
          img.alt = "本页二维码";
          pageQr.appendChild(img);
        };
        img.onerror = function () { /* keep placeholder */ };
        img.src = "page-qr.png";
      })();

      function normalizeName(s) {
        return String(s || "")
          .replace(/\s+/g, "")
          .replace(/[\u200b\u200c\u200d\ufeff]/g, "")
          .trim();
      }

      function normalizeId(s) {
        return String(s || "").trim().toUpperCase();
      }

      function showMsg(text, type) {
        msg.className = "msg " + (type || "error");
        msg.textContent = text;
      }

      function hideMsg() {
        msg.className = "msg";
        msg.textContent = "";
      }

      function hideResults() {
        resultCard.classList.remove("show");
      }

      function showStudent(rec) {
        document.getElementById("result-name").textContent = rec.name;
        document.getElementById("result-meta").textContent = "缴款书编号：" + rec.slipId;
        var img = document.getElementById("preview-img");
        img.src = rec.preview;
        img.alt = rec.name + " 缴款书预览";
        var pdf = document.getElementById("download-pdf");
        pdf.href = rec.pdf;
        pdf.setAttribute("download", rec.slipId + "_" + rec.name + ".pdf");
        var openP = document.getElementById("open-preview");
        openP.href = rec.preview;
        resultCard.classList.add("show");
        resultCard.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function toHex(buf) {
        var arr = new Uint8Array(buf);
        var hex = "";
        for (var i = 0; i < arr.length; i++) {
          var h = arr[i].toString(16);
          hex += h.length === 1 ? "0" + h : h;
        }
        return hex;
      }

      function sha256hex(str) {
        if (window.crypto && crypto.subtle && window.isSecureContext) {
          var enc = new TextEncoder().encode(str);
          return crypto.subtle.digest("SHA-256", enc).then(toHex);
        }
        return Promise.resolve(sha256sync(str));
      }

      function query() {
        hideMsg();
        hideResults();
        var name = normalizeName(nameInput.value);
        var idn = normalizeId(idInput.value);
        if (!name || !idn) {
          showMsg("请输入学生姓名和身份证号", "error");
          if (!name) nameInput.focus();
          else idInput.focus();
          return;
        }

        queryBtn.disabled = true;
        var payload = name + "|" + idn;
        sha256hex(payload).then(function (hash) {
          var hits = data.filter(function (s) {
            return normalizeName(s.name) === name && s.idHash === hash;
          });
          // Also treat name-not-found the same as hash mismatch (generic message).
          // If name exists but hash wrong, same FAIL.
          if (hits.length === 0) {
            showMsg(FAIL, "error");
            return;
          }
          showStudent(hits[0]);
        }).catch(function () {
          // fallback sync if subtle rejected
          var hash = sha256sync(payload);
          var hits = data.filter(function (s) {
            return normalizeName(s.name) === name && s.idHash === hash;
          });
          if (hits.length === 0) {
            showMsg(FAIL, "error");
            return;
          }
          showStudent(hits[0]);
        }).then(function () {
          queryBtn.disabled = false;
        });
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        query();
      });
      queryBtn.addEventListener("click", function (e) {
        e.preventDefault();
        query();
      });
    })();
  </script>
</body>
</html>
